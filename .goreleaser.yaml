version: 2

project_name: kitsu

before:
  hooks:
    - go mod tidy

builds:
  - id: kitsu
    main: ./cmd/kitsu
    binary: kitsu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'github.com/samuelsulo/kitsu/internal/version.Version={{ .Tag }}'
      - -X 'github.com/samuelsulo/kitsu/internal/version.Commit={{ .FullCommit }}'
      - -X 'github.com/samuelsulo/kitsu/internal/version.Date={{ .Date }}'

archives:
  - id: kitsu
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# CHANGELOG.md (Keep a Changelog) is maintained by hand: the release
# workflow always passes --release-notes with that tag's extracted
# section, which becomes the GitHub Release body as-is.
#
# Do NOT set `disable: true` here: that skips this entire pipe,
# including the part that loads --release-notes — with it set, the
# flag is silently ignored and the release body ends up empty (found
# the hard way on v1.0.0/v1.1.0). Only a manual `goreleaser release`
# run without --release-notes falls back to this default (a commit
# list), which never happens in the real release flow.
release:
  name_template: "{{ .Tag }}"
